name: Scheduled Security Scan

# =============================================================================
# WORKFLOW CONFIG
# -----------------------------------------------------------------------------
# JAVA_VERSION — JDK version used for build and analysis.
# JAVA_DIST    — JDK distribution.
# =============================================================================
env:
  JAVA_VERSION: '17'
  JAVA_DIST: 'temurin'

on:
  schedule:
    - cron: '0 4 * * *' # every day at 4:00 UTC

  workflow_dispatch:
    inputs:
      ai_model:
        description: 'Enter the AI model slug for the pentest in liteLLM format (e.g. openrouter/openai/gpt-chat-latest):'
        required: true
        type: string

      scan_mode:
        description: |
          Strix Scan Mode depth (Choose based on your use case):
          - quick: Fast checks for obvious vulnerabilities. (Best for CI/CD, PRs, smoke tests. Duration: Minutes).
          - standard: Balanced routine review. Uses source-aware mapping and static triage to prioritize dynamic exploit validation paths. (Duration: 30m - 1h).
          - deep: Thorough pentest. DEFAULT mode. Runs broad triage (semgrep, AST search, secrets, supply-chain checks) and systematically validates candidates dynamically. Explores edge cases, chained vulnerabilities, and complex paths. (Duration: 1-4h).
        required: true
        type: choice
        options:
          - standard
          - quick
          - deep
        default: 'standard'

      scope_mode:
        description: 'Scope Mode (full: scan everything, diff: only changed files)'
        required: true
        type: choice
        options:
          - full
          - diff
        default: 'full'

      llm_timeout:
        description: 'LLM request timeout in seconds (increase for huge contexts)'
        required: true
        type: string
        default: '600'

      max_retries:
        description: 'Maximum number of retries for API failures'
        required: true
        type: string
        default: '7'

permissions:
  contents: read

jobs:
  security-scan:
    name: 🔐 Security Scan CodeQL
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.3
        with:
          languages: java-kotlin
          queries: security-and-quality

      - name: Set up JDK ${{ env.JAVA_VERSION }} (${{ env.JAVA_DIST }})
        uses: actions/setup-java@v6.0.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DIST }}

      - name: Build for CodeQL
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.3

  security-scan-semgrep:
    name: 🔐 Security Scan Semgrep
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'

      - name: Setup Socket Firewall
        uses: socketdev/action@v1.3.2
        with:
          mode: firewall-free

      - name: Install Semgrep via Socket Firewall
        run: sfw pip install semgrep

      - name: Setup Semgrep Pro Engine via Socket Firewall
        run: sfw semgrep install-semgrep-pro

      # Exclude mutable action tag rule because Semgrep does not support the modern
      # actions.lockfile mechanism yet.
      - name: Run Semgrep
        run: |
          semgrep scan \
            --pro \
            --config auto \
            --config "p/java" \
            --config "p/owasp-top-ten" \
            --config "p/secrets" \
            --config "p/github-actions" \
            --config "p/supply-chain" \
            --exclude-rule "yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag" \
            --exclude "**/build/**" \
            --exclude "**/.gradle/**" \
            --exclude "**/test/**" \
            --sarif --output semgrep.sarif \
            --error

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.38.3
        if: always()
        with:
          sarif_file: semgrep.sarif

  security-scan-strix:
    name: 🔐 Security Scan Strix
    runs-on: ubuntu-latest

    if: github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      actions: read

    env:
      STRIX_LLM: ${{ github.event.inputs.ai_model }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_TIMEOUT: ${{ github.event.inputs.llm_timeout }}
      STRIX_LLM_MAX_RETRIES: ${{ github.event.inputs.max_retries }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Strix
        # nosemgrep: yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell
        run: |
          curl -sSL https://strix.ai/install | bash

      - name: Run Code Analysis via ${{ env.STRIX_LLM }}
        env:
          STRIX_SCAN_MODE: ${{ github.event.inputs.scan_mode }}
          STRIX_SCOPE_MODE: ${{ github.event.inputs.scope_mode }}
        run: |
          strix -n \
            -t ./ \
            --scan-mode "$STRIX_SCAN_MODE" \
            --scope-mode "$STRIX_SCOPE_MODE" \
            --instruction-file ".github/strix/rules.txt"

  security-scan-snyk:
    name: 🔐 Security Scan Snyk
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }} (${{ env.JAVA_DIST }})
        uses: actions/setup-java@v6.0.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DIST }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/gradle-9-jdk17@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          JAVA_HOME: /opt/java/openjdk # Enforce directory expected by the Snyk container
        with:
          args: --sarif-file-output=snyk.sarif

      - name: Upload Snyk scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.38.3
        if: always()
        with:
          sarif_file: 'snyk.sarif'

  security-scan-trivy:
    name: 🔐 Security Scan Trivy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'

      - name: Run Trivy (console report)
        if: failure()
        run: |
          echo "==== Trivy console report ===="
          trivy fs .

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.38.3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  security-scan-osv:
    name: 🔐 Security Scan OSV

    permissions:
      contents: read
      actions: read
      security-events: write

    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
    with:
      fail-on-vuln: true
      scan-args: |-
        --config=osv-scanner.toml
        --recursive
        ./

  security-scan-zizmor:
    name: 🔐 GitHub Actions Security (zizmor)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@v0.6.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  security-scan-gh-actions-lockfile:
    name: 🔐 Security Scan GitHub Actions Lockfile
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify GitHub Actions lockfile
        run: |
          gh extension install github/gh-actions-lock
          gh actions-lock --verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
